name: Update Downloads Count

on:
  schedule:
    - cron: '*/30 * * * *'
  push:
    paths:
      - 'launcher-data/mods/**'
  workflow_dispatch:

jobs:
  update-downloads:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Python Setup
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Fetch Release Download Counts
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python downloads_builder.py

      - name: Commit and push downloads.txt
        run: |
          git config --global user.name '[bot]'
          git config --global user.email '[bot]@users.noreply.github.com'
          git add launcher-data/downloads.txt
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update downloads.txt" && git push)
