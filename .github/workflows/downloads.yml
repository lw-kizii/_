name: Update Downloads Count

on:
  schedule:
    - cron: '0 * * * *'
  push:
    paths:
      - 'launcher-data/mods/**'
  workflow_dispatch:

jobs:
  update-downloads:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Python Setup
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Fetch Release Download Counts
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python -c '
          import os, json, urllib.request

          req = urllib.request.Request(
              "https://api.github.com/repos/lw-kizii/_/releases",
              headers={"User-Agent": "Downloads-Builder", "Accept": "application/vnd.github+json"}
          )
          token = os.environ.get("GITHUB_TOKEN")
          if token:
              req.add_header("Authorization", f"token {token}")

          lines = ["# Auto-generated downloads list", "# Format: asset_name=count"]
          try:
              with urllib.request.urlopen(req) as resp:
                  releases = json.loads(resp.read().decode("utf-8"))
                  for rel in releases:
                      for asset in rel.get("assets", []):
                          name = asset.get("name", "")
                          count = asset.get("download_count", 0)
                          if name:
                              lines.append(f"{name}={count}")
          except Exception as e:
              print(f"Error fetching releases: {e}")

          os.makedirs("launcher-data", exist_ok=True)
          with open("launcher-data/downloads.txt", "w", encoding="utf-8") as f:
              f.write("\n".join(lines) + "\n")

          print("Successfully updated launcher-data/downloads.txt")
          '

      - name: Commit and push downloads.txt
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add launcher-data/downloads.txt
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update downloads.txt [skip ci]" && git push)
