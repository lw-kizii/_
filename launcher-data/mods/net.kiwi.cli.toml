id = "net.kiwi.cli"
name = "SwCLI"
version = "1.0"
description = "A mod that lets you run Lua programs..."
longDescription = """
## The Terminal Mod
This mod brings a `Lua Terminal` so you can execute commands and programs from a single command line.

Learn more about Lua [here](https://www.lua.org/manual/5.1/). If you're a beginner, click [here](https://www.lua.org/pil/1.html) to find the friendliest beginner Lua guide.

## Purpose
This terminal was made so developers can test programs and code snippets easily without needing access to their codebase. It was also made so new modders can learn SwLua by executing related programs right inside of Swordigo!

## Usage
The text input is used to input commands/programs, for example: `Scene.OverrideLights(1, 0, 0)`
The arrow keys (up, down) are used to navigate between previously ran commands.
The run button... well, it's pretty self explanatory
"""
downloadUrl = "https://github.com/lw-kizii/_/releases/download/mods/cli.zip"
iconUrl = "https://raw.githubusercontent.com/lw-kizii/_/main/launcher-data/icons/cli.png"
